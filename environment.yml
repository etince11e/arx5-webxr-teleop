name: arx5-webxr-teleop
channels:
  - robostack-jazzy
  - conda-forge
  - nvidia
dependencies:
  - python=3.12
  - pip
  - wheel
  - setuptools
  - cxx-compiler
  - cmake>=3.25
  - ninja
  - make
  - pkg-config
  - pybind11
  - eigen=3.4.0
  - boost
  - orocos-kdl
  - spdlog=1.14.1
  - ros-jazzy-kdl-parser
  - ros-jazzy-ament-cmake
  - conda-forge::soem=1.4.0
  - libhidapi
  - libstdcxx-ng
  - libopencv>=4.13
  - nlohmann_json=3.11.3
  - zlib=1.3.1
  - nvidia::cuda-toolkit=12.8
  - nvidia::cudnn
  - numpy=1.26.4
  - pip:
      - uv
      - draccus==0.10.0
      - websockets>=15.0,<17.0
      - fastapi>=0.115
      - uvicorn[standard]>=0.30
      - huggingface-hub>=0.27.0
      - termcolor>=2.4.0,<4.0.0
      - spdlog>=2.0
      - pyrealsense2
      - matplotlib
